name: Windows ARM64 and x64
on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        include:
          - architecture: arm64
            runner: windows-11-arm
          - architecture: x64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Protocol and session tests
        run: dotnet test .\tests\ScrcpySend.Tests\ScrcpySend.Tests.csproj -c Release
      - name: Prepare native media
        run: .\tools\PrepareSrt.ps1 -Architecture ${{ matrix.architecture }}
      - name: Package app
        run: .\tools\Publish.ps1 -Architecture ${{ matrix.architecture }}
      - uses: actions/upload-artifact@v4
        with:
          name: ScrcpySend-Windows-${{ matrix.architecture }}
          path: artifacts\ScrcpySend-Windows-${{ matrix.architecture }}-dev.zip
